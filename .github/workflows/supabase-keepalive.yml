# Keep the production Supabase project active on the free tier.
# Free projects pause after 7 days without database activity.
# This workflow issues a lightweight PostgREST query twice per week.
#
# Required repository secrets (same values as Vercel):
#   SUPABASE_URL        — e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   — publishable key (sb_publishable_...) or legacy anon key (eyJ...)

name: Supabase keepalive

on:
  schedule:
    # Sunday and Wednesday at 12:00 UTC (well within the 7-day inactivity window)
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Trim accidental whitespace from copy-paste
          SUPABASE_URL="${SUPABASE_URL//[[:space:]]/}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY//[[:space:]]/}"
          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "Pinging ${SUPABASE_URL}/rest/v1/profiles"

          # New publishable keys (sb_publishable_...) must use apikey only.
          # Sending them as Authorization: Bearer causes a 401 Invalid JWT.
          CURL_HEADERS=(
            -H "apikey: ${SUPABASE_ANON_KEY}"
            -H "Accept: application/json"
          )
          if [[ "${SUPABASE_ANON_KEY}" == eyJ* ]]; then
            CURL_HEADERS+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          if ! curl --fail --silent --show-error \
            "${CURL_HEADERS[@]}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1"; then
            echo ""
            echo "Keepalive ping failed (HTTP 401 usually means the wrong key or"
            echo "a publishable key sent as Authorization: Bearer — use SUPABASE_ANON_KEY"
            echo "with your publishable/anon key and apikey header only)."
            exit 1
          fi

          echo "Keepalive ping succeeded."
