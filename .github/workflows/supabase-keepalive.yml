# Keep the production Supabase project active on the free tier.
# Free projects pause after 7 days without database activity.
# This workflow issues a lightweight PostgREST query twice per week.
#
# Required repository secrets (same values as Vercel):
#   SUPABASE_URL        — e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   — project anon/public key

name: Supabase keepalive

on:
  schedule:
    # Sunday and Wednesday at 12:00 UTC (well within the 7-day inactivity window)
    - cron: '0 12 * * 0,3'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "Pinging ${SUPABASE_URL}/rest/v1/profiles"
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1"
          echo "Keepalive ping succeeded."
