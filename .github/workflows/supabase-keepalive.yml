# Keep the production Supabase project active on the free tier.
# Free projects pause when they lack sufficient database activity over 7 days.
# Supabase docs (2026): "a few user requests to the database each day" is
# typically required — twice-weekly pings leave 4–5 idle days and still trigger
# the warning email even when each ping returns HTTP 200.
# This workflow issues a lightweight PostgREST query every 6 hours (4×/day).
#
# Required repository secrets (same values as Vercel):
#   SUPABASE_URL        — e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   — publishable key (sb_publishable_...) or legacy anon key (eyJ...)

name: Supabase keepalive

on:
  schedule:
    # Every 6 hours — meets Supabase's "few requests each day" guidance
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Trim accidental whitespace from copy-paste
          SUPABASE_URL="${SUPABASE_URL//[[:space:]]/}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY//[[:space:]]/}"
          SUPABASE_URL="${SUPABASE_URL%/}"

          echo "URL length: ${#SUPABASE_URL}, key length: ${#SUPABASE_ANON_KEY}, key prefix: ${SUPABASE_ANON_KEY:0:12}..."
          echo "Pinging ${SUPABASE_URL}/rest/v1/profiles"

          # New publishable keys (sb_publishable_...) must use apikey only.
          # Sending them as Authorization: Bearer causes a 401 Invalid JWT.
          CURL_HEADERS=(
            -H "apikey: ${SUPABASE_ANON_KEY}"
            -H "Accept: application/json"
          )
          if [[ "${SUPABASE_ANON_KEY}" == eyJ* ]]; then
            CURL_HEADERS+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          response=$(curl --silent --show-error -w '\n%{http_code}' \
            "${CURL_HEADERS[@]}" \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1")
          http_code=$(tail -n1 <<< "$response")
          body=$(sed '$d' <<< "$response")

          echo "HTTP status: ${http_code}"
          echo "Response body: ${body}"

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo ""
            echo "Keepalive ping failed. Check the response body above for the exact"
            echo "Supabase/PostgREST error (e.g. Invalid API key, JWT expired,"
            echo "permission denied) and confirm SUPABASE_URL / SUPABASE_ANON_KEY"
            echo "are from the SAME project and copied in full with no truncation."
            exit 1
          fi

          echo "Keepalive ping succeeded."
